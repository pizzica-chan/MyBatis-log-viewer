services:
  app:
    build: .
    image: mlv-java
    container_name: mlv-java
    restart: unless-stopped
    ports:
      - "8767:8767"
    environment:
      MLV_HOME: /app
    volumes:
      # サンプルログ（読み取り専用）。別ディレクトリを試す場合は MLV_LOG_DIR を指定
      - ${MLV_LOG_DIR:-./samples}:/app/logs/samples:ro
      # SQLite インデックスの永続化（2 回目以降の起動を高速化）
      - ./tmp:/app/tmp
    command: ["--host", "0.0.0.0", "--port", "8767", "--dir", "/app/logs/samples"]
