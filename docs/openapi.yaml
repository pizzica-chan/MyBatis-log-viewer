openapi: 3.0.3
info:
  title: MyBatis Log Viewer API
  version: 0.1.0
paths:
  /api/meta:
    get:
      summary: 読み込み状態・件数・期間
  /api/browse:
    get:
      summary: ディレクトリブラウザ
      parameters:
        - name: path
          in: query
          schema:
            type: string
  /api/load:
    post:
      summary: ログディレクトリのインデックス構築
  /api/sql:
    get:
      summary: SQL 一覧（フィルタ + ページング）
      parameters:
        - name: mapper
          in: query
          schema: { type: string }
        - name: sql_type
          in: query
          schema: { type: string }
        - name: sql
          in: query
          schema: { type: string }
        - name: parameters
          in: query
          schema: { type: string }
        - name: min_elapsed
          in: query
          schema: { type: integer }
        - name: max_elapsed
          in: query
          schema: { type: integer }
        - name: offset
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
  /api/sql/detail:
    get:
      summary: 生ログブロック詳細
  /api/stats/summary:
    get:
      summary: 統計サマリ
  /api/stats/mappers:
    get:
      summary: mapper 別集計
  /api/stats/slow:
    get:
      summary: 遅い SQL ランキング
